<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA CONTRA INCENDIO | GRUPOTIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Contenedor del video de fondo */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Esto asegura que cubra toda la pantalla sin deformarse */
        }

        /* Capa oscura para que el texto sea legible sobre el fuego */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Ajusta este valor (0.6) para más o menos oscuridad */
            z-index: -1;
        }
    </style>
</head>
<body class="text-white font-sans">

    <!-- EL VIDEO DE FONDO -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="fuego.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
    </div>
    <div class="overlay"></div>

    <!-- TU CONTENIDO AQUÍ -->
    <nav class="p-8">
        <a href="index.html" class="text-red-500 font-black text-2xl tracking-tighter uppercase">GRUPOTIC // <span class="text-white">FIRE_SYS</span></a>
    </nav>

    <main class="max-w-4xl mx-auto p-10">
        <h1 class="text-6xl font-black uppercase mb-10 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500">
            PROTECCIÓN CONTRA <br> INCENDIOS
        </h1>
        <div class="bg-black/40 backdrop-blur-md p-8 border-l-4 border-red-600">
            <h2 class="text-2xl font-bold mb-4">Ingeniería y Diseño</h2>
            <p class="text-gray-300">
                Implementamos soluciones bajo normas NFPA 25 y 72. 
                Nuestra ingeniería garantiza la seguridad de su propiedad horizontal.
            </p>
        </div>
    </main>

</body>
</html>
