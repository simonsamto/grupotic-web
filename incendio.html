<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PROTECCIÓN CONTRA INCENDIO | GRUPOTIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cargamos la librería de partículas desde un CDN confiable -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        #particles-js { position: fixed; width: 100%; height: 100%; z-index: -1; background-color: #000; }
        .glass { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(230, 57, 70, 0.3); }
    </style>
</head>
<body class="text-white font-sans">

    <!-- Fondo de Partículas Animadas (Se genera solo) -->
    <div id="particles-js"></div>

    <nav class="p-6 border-b border-red-900/30 flex justify-between items-center backdrop-blur-md">
        <a href="index.html" class="text-red-500 font-black text-2xl uppercase tracking-tighter">GRUPOTIC</a>
        <a href="contacto.html" class="border border-red-500 px-6 py-2 text-xs font-bold hover:bg-red-600 transition">COTIZAR</a>
    </nav>

    <main class="max-w-4xl mx-auto p-10 mt-10">
        <h1 class="text-6xl font-black uppercase mb-10 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500">
            SISTEMA DE PROTECCIÓN<br> CONTRA INCENDIOS
        </h1>
        <div class="glass p-8 border-l-4 border-red-600">
            <h2 class="text-2xl font-bold mb-4">Ingeniería NFPA</h2>
            <p class="text-gray-300">Certificados bajo normas NFPA 25 y 72. Instalación de redes hidráulicas, rociadores automáticos y agentes limpios para proteger tus activos críticos.</p>
        </div>
    </main>

    <script>
        // Configuración de las partículas de incendio
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": ["#ff0000", "#ff4500", "#ff8c00"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3, "random": true },
                "move": { "enable": true, "speed": 2, "direction": "top", "random": true }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "repulse" } } }
        });
    </script>
</body>
</html>
